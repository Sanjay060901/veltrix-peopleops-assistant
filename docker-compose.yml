services:
  assistant:
    build: .
    ports:
      - "8000:8000"
    volumes:
      # Graders replace ./data with their own corpus, manifest and database.
      - ./data:/app/data
      # Ingestion cache survives container rebuilds; unchanged files are not re-parsed.
      - ingest-cache:/app/.cache
    environment:
      CORPUS_DIR: ${CORPUS_DIR:-./data/corpus}
      MANIFEST_PATH: ${MANIFEST_PATH:-./data/manifest.json}
      DB_PATH: ${DB_PATH:-./data/veltrix.db}
      APP_TODAY: ${APP_TODAY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-10}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}
      CORPUS_TOKEN_BUDGET: ${CORPUS_TOKEN_BUDGET:-3000}
      LEAVE_YEAR: ${LEAVE_YEAR:-2026}
      HISTORY_TURNS: ${HISTORY_TURNS:-6}
      CORPUS_RELOAD_SECONDS: ${CORPUS_RELOAD_SECONDS:-30}
      CACHE_DIR: ${CACHE_DIR:-/app/.cache/ingest}
      UI_ENABLED: ${UI_ENABLED:-false}
      IDENTITY_SECRET: ${IDENTITY_SECRET:-}
      IDENTITY_MAX_AGE_SECONDS: ${IDENTITY_MAX_AGE_SECONDS:-300}
      AUTH_MODE: ${AUTH_MODE:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      LOGIN_IDLE_MINUTES: ${LOGIN_IDLE_MINUTES:-30}
      LOGIN_ABSOLUTE_HOURS: ${LOGIN_ABSOLUTE_HOURS:-8}
      LOGIN_MAX_FAILURES: ${LOGIN_MAX_FAILURES:-5}
      LOGIN_LOCKOUT_MINUTES: ${LOGIN_LOCKOUT_MINUTES:-15}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      HF_HUB_OFFLINE: "1"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 20s

volumes:
  ingest-cache:
